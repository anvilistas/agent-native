site_name: Agent-native Anvil
site_url: https://anvilistas.github.io/agent-native/
repo_url: https://github.com/anvilistas/agent-native
repo_name: anvilistas/agent-native
edit_uri: edit/master/docs/
site_description: Expose Anvil tools and Forms to agent conversations

theme:
  name: readthedocs
markdown_extensions:
  - admonition
  - toc:
      permalink: true
plugins:
  - search
hooks:
  - docs_hooks.py
nav:
  - Overview: index.md
  - Quick start: quick-start.md
  - Authentication: authentication.md
  - API reference: api-reference.md
  - Development: development.md
